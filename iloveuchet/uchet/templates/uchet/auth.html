{% extends 'uchet/base.html' %}

{% block content %}
    <div>
        <form method="post" class="main" action="">
            {% csrf_token %}
            <h1>Авторизация</h1>
            {{form.contacts}}
            {{form.password}}
            <button type="submit">Войти</button>
            <h2>Нет аккаунта? Обратитесь к администратору</h2>
             {% if form.non_field_errors %}
                <div class="errors">{{ form.non_field_errors }}</div>
            {% endif %}
        </form>
    </div>
{% endblock %}
