{% extends 'uchet/base.html' %}

{% block content %}
    <div>
        <form method="post" class="main" action="">
            {% csrf_token %}
            <h1>Изменить заявку №{{bid.id}}</h1>
            {{ form.problem_text }}
            <button type="submit">Сохранить изменения</button>
            <a href="{% url 'show_bid' bid.id %}">Отмена</a>
        </form>
    </div>
{% endblock %}
