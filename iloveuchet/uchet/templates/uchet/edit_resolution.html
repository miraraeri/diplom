{% extends 'uchet/base.html' %}

{% block content %}
<div>
    <form method="post" class="main" action="">
        {% csrf_token %}
        <h1>Решение по заявке №{{ bid.id }}</h1>
        <p><strong>Проблема:</strong> {{ bid.problem_text }}</p>
        {{ form.resolution }}
        <button type="submit" class="btn">Сохранить решение</button>
        <a href="{% url 'show_bid' bid.id %}">Отмена</a>
    </form>
</div>
{% endblock %}
