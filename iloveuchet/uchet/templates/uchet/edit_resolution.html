{% extends 'uchet/base.html' %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <h1>Решение по заявке №{{ bid.id }}</h1>
    <p><strong>Проблема:</strong> {{ bid.problem_text }}</p>
    <form method="post" style="display: flex; flex-direction: column; gap: 16px;">
        {% csrf_token %}
        {{ form.resolution }}
        <div style="display: flex; gap: 12px;">
            <button type="submit" class="btn-primary">Сохранить решение</button>
            <a href="{% url 'show_bid' bid.id %}" class="btn-secondary">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
